site:
  name: "FAQ"
  description: "AI-powered tech news, autonomously researched and published daily"
  url: "https://faq.com.tw"
  language: "en"

feeds:
  # AI & ML
  - name: "MIT Technology Review"
    slug: "mittechreview"
    url: "https://www.technologyreview.com/feed/"
    category: "ai-ml"
  - name: "OpenAI Blog"
    slug: "openai"
    url: "https://openai.com/blog/rss.xml"
    category: "ai-ml"
  - name: "Google AI Blog"
    slug: "googleai"
    url: "https://blog.google/technology/ai/rss/"
    category: "ai-ml"
  - name: "Hugging Face Blog"
    slug: "huggingface"
    url: "https://huggingface.co/blog/feed.xml"
    category: "ai-ml"
  # Policy
  - name: "EFF"
    slug: "eff"
    url: "https://www.eff.org/rss/updates.xml"
    category: "policy"
  - name: "Brookings TechTank"
    slug: "brookings"
    url: "https://www.brookings.edu/topic/technology-policy/feed/"
    category: "policy"
  - name: "TechPolicy.press"
    slug: "techpolicy"
    url: "https://techpolicy.press/feed"
    category: "policy"
  # Developer Tools
  - name: "GitHub Blog"
    slug: "github"
    url: "https://github.blog/feed/"
    category: "developer-tools"
  - name: "InfoQ"
    slug: "infoq"
    url: "https://feed.infoq.com/"
    category: "developer-tools"
  - name: "The New Stack"
    slug: "thenewstack"
    url: "https://thenewstack.io/feed/"
    category: "developer-tools"

  # Hardware
  - name: "AnandTech / Chips and Cheese"
    slug: "chipsandcheese"
    url: "https://chipsandcheese.com/feed/"
    category: "hardware"
  - name: "Semianalysis (substack)"
    slug: "semianalysis"
    url: "https://www.semianalysis.com/feed"
    category: "hardware"
  - name: "ServeTheHome"
    slug: "servethehome"
    url: "https://www.servethehome.com/feed/"
    category: "hardware"

pipeline:
  max_articles_per_feed: 15
  max_articles_per_day: 100
  # Public site: one high-signal story per category, four news items plus one
  # bilingual analysis topic per daily run. Everything else stays internal.
  articles_per_category: 1
  public_categories: [ai-ml, developer-tools, policy, hardware]
  public_news_per_run: 4
  public_analysis_topics_per_run: 1
  trending_count: 7
  # Keep daily publication source-backed. Long-form trend analysis can surface
  # personal names from older corpus entries and therefore requires review.
  analysis_count: 0
  fetch_delay_seconds: 1.0
  batch_size: 10

api:
  summarize_model: "claude-sonnet-4-6"
  analysis_model: "claude-opus-4-6"
  max_retries: 3
  rate_limit_rpm: 50

# Editorial DNA injection (女娲 perspective skills).
# Each phase can blend in mental models + heuristics + expression DNA from
# installed skills under .claude/skills/<name>-perspective/. Set to [] to disable.
# Available short names: mrbeast, feynman, paul-graham (pg), zhang-yiming.
perspectives:
  summarize: [mrbeast, feynman]
  # generate_analysis: [paul-graham, zhang-yiming]  # future
  # threads: [mrbeast]                              # future

categories:
  - slug: "ai-ml"
    name: "AI & ML"
    color: "#8B5CF6"
  - slug: "startups"
    name: "Startups"
    color: "#F59E0B"
  - slug: "products"
    name: "Products"
    color: "#10B981"
  - slug: "policy"
    name: "Policy"
    color: "#EF4444"
  - slug: "industry"
    name: "Industry"
    color: "#3B82F6"
  - slug: "developer-tools"
    name: "Dev Tools"
    color: "#06B6D4"
  - slug: "hardware"
    name: "Hardware"
    color: "#F97316"

threads:
  posts_per_day: 6
  start_hour: 8           # UTC
  end_hour: 22             # UTC
  delay_between_posts: 30  # seconds

paths:
  raw: "data/raw"
  wiki: "data/wiki"
  dedup: "data/dedup"
  content: "src/content/articles"
  prompts: "prompts"
